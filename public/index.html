<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de horas - Agencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <header class="bg-slate-900 text-white p-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold">Carga y reportes de horas</h1>
        <p class="text-sm text-slate-300">Programadores · Clientes · Administrador</p>
      </div>
      <div id="user-info" class="text-sm"></div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6">
      <section id="login-section" class="bg-white shadow rounded p-4">
        <h2 class="text-xl font-semibold mb-2">Login</h2>
        <div class="grid gap-4 md:grid-cols-2">
          <label class="flex flex-col gap-1">
            <span class="text-sm">Email</span>
            <input id="email" type="email" class="border rounded px-3 py-2" placeholder="usuario@correo.com" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Contraseña</span>
            <input id="password" type="password" class="border rounded px-3 py-2" placeholder="••••••" />
          </label>
        </div>
        <button id="login-btn" class="mt-3 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Ingresar</button>
        <p id="login-error" class="text-red-600 text-sm mt-2"></p>
      </section>

      <section id="programmer-panel" class="hidden bg-white shadow rounded p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xl font-semibold">Panel Programador</h2>
          <button id="refresh-programmer" class="text-sm text-blue-600">Actualizar</button>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <label class="flex flex-col gap-1">
            <span class="text-sm">Colaborador ID</span>
            <input id="collaborator-id" type="number" class="border rounded px-3 py-2" />
            <span class="text-xs text-slate-500">Completar con el ID de colaborador asignado.</span>
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Cliente ID</span>
            <input id="client-id" type="number" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Departamento ID</span>
            <input id="department-id" type="number" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Tarea/Ticket ID (opcional)</span>
            <input id="task-id" type="number" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Fecha</span>
            <input id="fecha" type="date" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Hora inicio</span>
            <input id="hora-inicio" type="time" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Hora fin</span>
            <input id="hora-fin" type="time" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1 md:col-span-2">
            <span class="text-sm">Descripción detallada</span>
            <textarea id="descripcion" class="border rounded px-3 py-2" rows="3"></textarea>
          </label>
        </div>
        <button id="save-time-entry" class="mt-3 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Guardar entrada</button>
        <p id="programmer-message" class="text-sm mt-2"></p>

        <div class="mt-6">
          <h3 class="font-semibold mb-2">Mis horas recientes</h3>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm border">
              <thead class="bg-slate-100">
                <tr>
                  <th class="p-2 border">Fecha</th>
                  <th class="p-2 border">Cliente</th>
                  <th class="p-2 border">Departamento</th>
                  <th class="p-2 border">Horas</th>
                  <th class="p-2 border">Descripción</th>
                </tr>
              </thead>
              <tbody id="programmer-rows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="admin-panel" class="hidden bg-white shadow rounded p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xl font-semibold">Panel Administrador</h2>
          <button id="refresh-admin" class="text-sm text-blue-600">Actualizar</button>
        </div>
        <div class="grid md:grid-cols-3 gap-4">
          <label class="flex flex-col gap-1">
            <span class="text-sm">Nombre cliente</span>
            <input id="admin-client-name" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Email contacto</span>
            <input id="admin-client-email" class="border rounded px-3 py-2" />
          </label>
          <button id="create-client" class="self-end bg-blue-600 text-white px-4 py-2 rounded">Crear cliente</button>

          <label class="flex flex-col gap-1">
            <span class="text-sm">Nombre departamento</span>
            <input id="admin-dept-name" class="border rounded px-3 py-2" />
          </label>
          <div></div>
          <button id="create-dept" class="self-end bg-blue-600 text-white px-4 py-2 rounded">Crear departamento</button>
        </div>

        <div class="mt-6 grid md:grid-cols-3 gap-4">
          <label class="flex flex-col gap-1">
            <span class="text-sm">Cliente ID</span>
            <input id="report-client-id" type="number" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Desde</span>
            <input id="report-from" type="date" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Hasta</span>
            <input id="report-to" type="date" class="border rounded px-3 py-2" />
          </label>
        </div>
        <div class="flex gap-2 mt-3">
          <button id="load-summary" class="bg-indigo-600 text-white px-4 py-2 rounded">Ver resumen</button>
          <button id="download-excel" class="bg-emerald-600 text-white px-4 py-2 rounded">Descargar Excel</button>
          <button id="send-mail" class="bg-orange-600 text-white px-4 py-2 rounded">Enviar correo</button>
        </div>
        <div id="summary-table" class="mt-4 text-sm"></div>
      </section>

      <section id="client-panel" class="hidden bg-white shadow rounded p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xl font-semibold">Panel Cliente</h2>
          <button id="refresh-client" class="text-sm text-blue-600">Actualizar</button>
        </div>
        <div class="grid md:grid-cols-3 gap-4">
          <label class="flex flex-col gap-1">
            <span class="text-sm">Desde</span>
            <input id="client-from" type="date" class="border rounded px-3 py-2" />
          </label>
          <label class="flex flex-col gap-1">
            <span class="text-sm">Hasta</span>
            <input id="client-to" type="date" class="border rounded px-3 py-2" />
          </label>
          <button id="client-download" class="self-end bg-emerald-600 text-white px-4 py-2 rounded">Descargar Excel</button>
        </div>
        <div class="overflow-x-auto mt-4">
          <table class="min-w-full text-sm border">
            <thead class="bg-slate-100">
              <tr>
                <th class="p-2 border">Colaborador</th>
                <th class="p-2 border">Departamento</th>
                <th class="p-2 border">Fecha</th>
                <th class="p-2 border">Horas</th>
                <th class="p-2 border">Descripción</th>
              </tr>
            </thead>
            <tbody id="client-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
